<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공지 체크보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f6f7f9; --side:#fbfbfc; --panel:#ffffff; --panel2:#f7f8fa; --line:#eceef2; --line2:#dfe2e8;
  --text:#14161b; --muted:#6b717f; --faint:#a4a9b4;
  --accent:#3b5bdb; --accent-soft:#eef2ff; --accent-ink:#ffffff;
  --ok:#2f9e6b; --ok-soft:#e9f7f0; --warn:#d9822b; --warn-soft:#fdf3e8; --bad:#e03e3e; --bad-soft:#fdeeee;
  --c1:#3b5bdb; --c2:#8b5cf6; --c3:#0e9f8c; --c4:#d9822b; --c5:#8a909c;
  --shadow-s:0 1px 2px rgba(16,24,40,.04);
  --shadow-l:0 20px 50px rgba(16,24,40,.16);
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --serif:var(--sans);
}
:root[data-theme="dark"]{
  --bg:#0f1013; --side:#121317; --panel:#17181c; --panel2:#1c1e23; --line:#25272d; --line2:#30333a;
  --text:#ecedf0; --muted:#9398a3; --faint:#5d626c;
  --accent:#7c93f5; --accent-soft:#1d2238; --accent-ink:#0f1013;
  --ok:#4cc38a; --ok-soft:#15261e; --warn:#f0a150; --warn-soft:#2a2016; --bad:#f06a6a; --bad-soft:#2c1819;
  --c1:#7c93f5; --c2:#a78bfa; --c3:#3cc7b2; --c4:#f0a150; --c5:#9398a3;
  --shadow-s:none; --shadow-l:0 20px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--accent);text-underline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 14px;overflow:auto}
.brand{padding:2px 8px 16px}
.brand .mark{font-size:15px;font-weight:700;letter-spacing:-.02em}
.brand .mark i{font-style:normal;color:var(--accent)}
.brand .sub{font-size:11px;color:var(--faint);margin-top:1px}
.mebox{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;margin-bottom:16px}
.mebox label{font-size:10.5px;color:var(--faint);display:block;margin-bottom:4px}
.mebox .row{display:flex;align-items:center;gap:8px}
.mebox select{flex:1;min-width:0;background:transparent;border:0;font-weight:600;font-size:13px;padding:0;outline:none}
.nav-t{font-size:10.5px;color:var(--faint);margin:4px 8px 4px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:1px;margin-bottom:14px}
.nav button{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;text-align:left;color:var(--muted);font-weight:500;font-size:13px}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .ic{width:14px;text-align:center;font-size:12px;opacity:.75}
.nav .ct{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.nav button.on .ct{color:var(--accent)}
.nav .ct.hot{background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;line-height:16px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.side-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:0 6px}
.status .dot{background:var(--faint);width:6px;height:6px}
.status.live .dot{background:var(--ok)}
.status.err{color:var(--bad)} .status.err .dot{background:var(--bad)}
.banner.err{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.banner.err ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.banner .codes{margin-top:6px;font-size:11px;color:var(--muted);font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.side-foot .btns{display:flex;gap:2px}

.main{min-width:0;padding:24px 32px 60px;max-width:1120px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-weight:700;font-size:19px;letter-spacing:-.03em;margin:0;line-height:1.3}
.head .date{color:var(--faint);font-size:12px;margin-top:1px}
.head .sp{flex:1}

.btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:var(--panel);padding:6px 12px;border-radius:7px;font-weight:600;font-size:12.5px;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{background:var(--ok);filter:brightness(1.05)}
.btn.on-r{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.on-d{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--text);background:var(--panel2)}
.btn.danger{color:var(--bad)}
.field{background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:6px 10px;outline:none;transition:.12s;font-size:12.5px}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search{position:relative;min-width:200px}
.search input{width:100%;padding-left:28px}
.search::before{content:"";position:absolute;left:10px;top:50%;width:9px;height:9px;border:1.5px solid var(--faint);border-radius:50%;transform:translateY(-62%)}
.search::after{content:"";position:absolute;left:18px;top:58%;width:4px;height:1.5px;background:var(--faint);transform:rotate(45deg)}

.band{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.band button{padding:11px 14px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;transition:.12s;box-shadow:var(--shadow-s)}
.band button:hover{border-color:var(--line2)}
.band .k{font-size:11.5px;color:var(--muted);font-weight:500}
.band .v{font-size:20px;font-weight:700;line-height:1.3;margin-top:2px;letter-spacing:-.02em}
.band .v small{font-size:11px;color:var(--faint);font-weight:500;margin-left:2px}
.band .warn .v{color:var(--warn)} .band .bad .v{color:var(--bad)}

.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--muted)}
.chip:hover{color:var(--text);background:var(--panel)}
.chip.on{background:var(--text);color:var(--bg);font-weight:600}

.day{margin-bottom:22px}
.day-h{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
.day-h h3{font-size:13px;font-weight:700;margin:0}
.day-h .rel{font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:0 6px;border-radius:4px}
.day-h .cnt{color:var(--faint);font-size:11.5px;margin-left:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-s);overflow:hidden}
.row{display:grid;grid-template-columns:1fr 250px;gap:18px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;transition:background .12s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--panel2)}
.row.unread::before,.row.over::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:0 2px 2px 0;background:var(--accent)}
.row.over::before{background:var(--bad)}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--cc)}
.cat .dot{background:var(--cc);width:6px;height:6px}
[data-c="공지사항"]{--cc:var(--c1)} [data-c="학사공지"]{--cc:var(--c2)} [data-c="교육공지"]{--cc:var(--c3)} [data-c="자료정보"]{--cc:var(--c4)} [data-c="기타"]{--cc:var(--c5)}
.tt{font-size:13.5px;font-weight:600;margin:2px 0 3px;line-height:1.45}
.flag{display:inline-block;font-size:10px;font-weight:600;padding:0 5px;line-height:17px;border-radius:4px;margin-right:5px;vertical-align:1px}
.flag.imp{background:var(--bad-soft);color:var(--bad)}
.flag.act{background:var(--warn-soft);color:var(--warn)}
.flag.mine{background:var(--accent-soft);color:var(--accent)}
.flag.done{background:var(--ok-soft);color:var(--ok)}
.meta{display:flex;flex-wrap:wrap;gap:2px 10px;color:var(--faint);font-size:11.5px}
.meta .edited{color:var(--warn)}
.due.over{color:var(--bad);font-weight:600} .due.soon{color:var(--warn);font-weight:600}
.snip{color:var(--muted);font-size:12px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

.chk{display:flex;flex-direction:column;gap:4px;justify-content:center;border-left:1px solid var(--line);padding-left:16px}
.avs{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:1px}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:9px;font-weight:600;letter-spacing:-.04em;background:var(--panel2);color:var(--faint);border:1px solid var(--line2);flex:none}
.av.r{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.av.d{background:var(--ok);color:#fff;border-color:transparent}
.av.me{box-shadow:0 0 0 1px var(--panel),0 0 0 2px var(--accent)}
.who-line{font-size:11.5px;display:flex;gap:6px;align-items:baseline;line-height:1.4}
.who-line b{font-weight:600;white-space:nowrap}
.who-line span{color:var(--muted)}
.who-line.no b{color:var(--bad)} .who-line.ok b{color:var(--ok)} .who-line.pend b{color:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:56px 0;font-size:12.5px}
.empty .serif{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px}

.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.tm{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tm .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-bottom:6px}
.tm .kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:1px 0}
.tm .kv b{font-variant-numeric:tabular-nums;color:var(--text);font-weight:600}
.tm .kv b.w{color:var(--warn)} .tm .kv b.xx{color:var(--bad)}
.tbl-wrap{overflow:auto}
table.mx{width:100%;border-collapse:collapse}
.mx th,.mx td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;font-size:12px;white-space:nowrap}
.mx th{font-size:11px;color:var(--muted);font-weight:600;background:var(--panel2)}
.mx tr:last-child td{border-bottom:0}
.mx .l{text-align:left}
.mx td.t{cursor:pointer;font-weight:500;white-space:normal;min-width:200px}
.mx td.t:hover{color:var(--accent)}
.mk{font-weight:600;font-size:11px;padding:1px 6px;border-radius:4px}
.mk.no{color:var(--bad);background:var(--bad-soft)} .mk.r{color:var(--accent);background:var(--accent-soft)} .mk.d{color:var(--ok);background:var(--ok-soft)}
.note{color:var(--faint);font-size:11.5px;margin-top:8px}

.lg{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.lg:last-child{border-bottom:0}
.lg .tm2{font-variant-numeric:tabular-nums;color:var(--faint);font-size:11.5px;padding-top:3px}
.lg .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lg .by{font-weight:600}
.act{font-size:10.5px;font-weight:600;padding:0 6px;line-height:17px;border-radius:4px;background:var(--panel2);color:var(--muted)}
.act.create{color:var(--c3);background:color-mix(in srgb,var(--c3) 12%,transparent)}
.act.edit{color:var(--warn);background:var(--warn-soft)}
.act.delete{color:var(--bad);background:var(--bad-soft)}
.act.read{color:var(--accent);background:var(--accent-soft)}
.act.done{color:var(--ok);background:var(--ok-soft)}
.act.comment{color:var(--c2);background:color-mix(in srgb,var(--c2) 12%,transparent)}
.lg .ref{font-weight:500;cursor:pointer}
.lg .ref:hover{text-decoration:underline}
.lg .ref.gone{cursor:default;text-decoration:line-through;color:var(--faint)}
.chg{margin-top:6px;display:flex;flex-direction:column;gap:3px;font-size:12px}
.chg .f{color:var(--muted);display:inline-block;min-width:56px;font-weight:500}
.chg del{color:var(--bad);text-decoration:line-through}
.chg ins{color:var(--ok);text-decoration:none;font-weight:600}
.diff{margin-top:2px;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:11.5px;line-height:1.6}
.diff div{padding:1px 10px;white-space:pre-wrap;word-break:break-word}
.diff .a{background:var(--ok-soft);color:var(--ok)}
.diff .a::before{content:"+ ";opacity:.6}
.diff .d{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.diff .d::before{content:"− ";opacity:.6}
.diff .s{color:var(--faint)}
.quote{margin-top:4px;padding:4px 10px;border-left:2px solid var(--line2);color:var(--muted);font-size:12px;white-space:pre-wrap}

.scrim{position:fixed;inset:0;background:rgba(16,18,24,.28);opacity:0;pointer-events:none;transition:.18s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow-l);transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);z-index:45;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{padding:16px 20px 14px;border-bottom:1px solid var(--line)}
.dr-h .top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.dr-h h2{font-size:16px;font-weight:700;line-height:1.4;margin:0 0 6px;letter-spacing:-.02em}
.x{width:26px;height:26px;border-radius:6px;font-size:17px;line-height:1;color:var(--faint);margin-left:auto}
.x:hover{background:var(--panel2);color:var(--text)}
.mybar{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.dr-b{padding:16px 20px;overflow:auto;flex:1}
.dr-f{padding:10px 20px;border-top:1px solid var(--line);display:flex;gap:6px}
.body{white-space:pre-wrap;word-break:break-word;line-height:1.75;font-size:13px}
.links{margin-top:10px;display:flex;flex-direction:column;gap:3px;font-size:12px;padding:8px 10px;background:var(--panel2);border-radius:6px}
.sec{margin-top:20px}
.sec-t{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:8px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{background:var(--panel2);border-radius:8px;padding:9px 11px}
.box h4{margin:0 0 6px;font-size:11.5px;font-weight:600;display:flex;justify-content:space-between}
.box.ok h4{color:var(--ok)} .box.no h4{color:var(--bad)} .box.r h4{color:var(--accent)} .box.p h4{color:var(--warn)}
.box ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.box li{display:flex;align-items:center;gap:6px;font-size:12px}
.box li small{margin-left:auto;color:var(--faint);font-size:10.5px;font-variant-numeric:tabular-nums}
.box .none{color:var(--faint);font-size:11.5px}
.cm{padding:7px 0;border-bottom:1px solid var(--line)}
.cm:last-of-type{border-bottom:0}
.cm .h{display:flex;gap:6px;align-items:center;font-size:12px}
.cm .h small{color:var(--faint);font-size:11px}
.cm p{margin:2px 0 0 28px;white-space:pre-wrap;font-size:12.5px}
.cm-in{display:flex;gap:6px;margin-top:8px}
.cm-in input{flex:1}
.tl{position:relative;padding-left:14px}
.tl::before{content:"";position:absolute;left:3px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.tl .ev{position:relative;padding:2px 0 9px}
.tl .ev::before{content:"";position:absolute;left:-14px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--line2)}
.tl .ev.create::before{background:var(--c3)} .tl .ev.edit::before{background:var(--warn)}
.tl .ev.done::before{background:var(--ok)} .tl .ev.read::before{background:var(--accent)} .tl .ev.comment::before{background:var(--c2)}
.tl .ev .h{font-size:12px}
.tl .ev .h small{color:var(--faint);margin-left:4px;font-size:11px;font-variant-numeric:tabular-nums}

.modal-wrap{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;padding:8vh 16px;z-index:60;overflow:auto;background:rgba(16,18,24,.32)}
.modal-wrap.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-l);width:100%;max-width:560px}
.modal .mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh h2{font-size:15px;font-weight:700;margin:0}
.modal .mb{padding:16px 18px}
.modal .mf{display:flex;gap:6px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:500;color:var(--muted)}
.form .full{grid-column:1/-1}
.form textarea{min-height:150px;resize:vertical;line-height:1.65}
.form .field{color:var(--text);font-size:13px}
.tog{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--text)!important;font-size:12.5px!important;padding:7px 10px;border:1px solid var(--line2);border-radius:7px;cursor:pointer}
.tog input{accent-color:var(--accent);width:14px;height:14px;margin:0}
.mem{display:flex;flex-direction:column}
.mem div{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.mem span{flex:1;font-weight:500}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,8px);background:var(--text);color:var(--bg);padding:7px 14px;border-radius:8px;font-weight:500;opacity:0;transition:.18s;pointer-events:none;z-index:99;font-size:12.5px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.banner{background:var(--accent-soft);color:var(--text);padding:8px 12px;border-radius:8px;margin-bottom:14px;font-size:12.5px}

@media (max-width:1000px){ .row{grid-template-columns:1fr 210px} }
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 4px 8px}
  .mebox{margin-bottom:8px}
  .nav-t{display:none}
  .nav{flex-direction:row;overflow-x:auto;margin-bottom:6px}
  .nav button{flex:none}
  .nav .ct{margin-left:4px}
  .side-foot{flex-direction:row;align-items:center;justify-content:space-between;padding-top:8px}
  .main{padding:16px 16px 50px}
  .band{grid-template-columns:repeat(2,1fr);gap:8px}
  .row{grid-template-columns:1fr;gap:8px;padding:11px 14px}
  .chk{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:8px;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px 10px}
  .avs{width:100%}

<body>

  <aside class="side">

  <form class="login-card" id="loginForm" onsubmit="return false">
    <div class="mark">공지 체크보드</div>
    <p class="sub">팀 계정으로 로그인하세요</p>

    <label>비밀번호<input class="field" id="lgPw" type="password" autocomplete="current-password" required></label>

    <p class="hint">계정은 관리자가 Firebase 콘솔 › Authentication › 사용자에서 추가합니다.</p>
  </form>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   1) Firebase 설정 — Firebase 콘솔 > 프로젝트 설정 > 웹 앱 값을 붙여넣으세요.
      apiKey가 비어 있으면 '체험 모드'(이 브라우저에만 저장)로 동작합니다.
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
const P = "noticeboard";   // 컬렉션: noticeboard_notices / noticeboard_meta / noticeboard_log
const LOG_LIMIT = 2000;    // 불러올 최근 이력 수

const CATS = ["공지사항","학사공지","교육공지","자료정보","기타"];
const FIELDS = {cat:"분류",date:"게시일",title:"제목",body:"내용",links:"링크",important:"중요",needAction:"처리 필요",due:"처리 기한"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const ymd = ms => { const d=new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const hm = ms => { const d=new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const mdhm = ms => { const d=new Date(ms); return `${d.getMonth()+1}/${d.getDate()} ${hm(ms)}`; };
const stamp = v => typeof v === "number" ? mdhm(v) : (v || "");
const today = () => ymd(Date.now());
const WD = ["일","월","화","수","목","금","토"];
const initials = n => { n = String(n||"?"); return n.length >= 3 ? n.slice(-2) : n; };
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const clip = (s,n=5000) => { s = String(s ?? ""); return s.length > n ? s.slice(0,n) : s; };

/* =========================================================
   2) 저장소 — Firestore(실시간) / 체험 모드(localStorage)
   ========================================================= */
const Store = (() => {
  let notices = [], members = [], logs = [], listeners = [];
  const emit = () => listeners.forEach(f => f());
  let db = null;
  const col = n => db.collection(P + "_" + n);

  let unsubs = [];
  function subscribe(){
    const onErr = what => e => { console.error(what, e); api.diag.errors[what] = e.code || e.message; emit(); };
    const ok = what => { delete api.diag.errors[what]; api.diag.loaded = true; };
    unsubs = [
      col("notices").onSnapshot(s => { notices = s.docs.map(d => ({id:d.id, ...d.data()})); ok("공지"); emit(); }, onErr("공지")),
      col("meta").doc("members").onSnapshot(d => { members = (d.exists && d.data().list) || []; ok("팀원"); emit(); }, onErr("팀원")),
      col("log").orderBy("at","desc").limit(LOG_LIMIT).onSnapshot(s => { logs = s.docs.map(d => ({id:d.id, ...d.data()})); ok("변경 이력"); emit(); }, onErr("변경 이력"))
    ];
  }
  function unsubscribe(){ unsubs.forEach(f => { try{ f(); }catch(e){} }); unsubs = []; notices = []; members = []; logs = []; api.diag.errors = {}; api.diag.loaded = false; }

  async function initLive(){
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    // 이메일/비밀번호 로그인: 로그인 상태가 바뀔 때마다 구독을 켜고 끔
    firebase.auth().onAuthStateChanged(user => {
      api.user = user ? {uid:user.uid, email:user.email||""} : null;
      api.authReady = true;
      unsubscribe();
      if(user) subscribe();
      emit();
    });
  }

  function seed(){
    const now = Date.now(), H = 3600e3, D = 24*H, t = today();
    const dd = n => ymd(now + n*D);
    members = ["김태욱","이서연","박준호"];
    const a = {id:uid(),cat:"학사공지",date:t,title:"10월 개강반 시간표 확정 안내",body:"10월 개강반 시간표가 확정되었습니다.\n상담 시 변경된 시간표로 안내 부탁드립니다.\n토요반은 오전 10시 시작입니다.",links:"",important:true,needAction:true,due:dd(2),author:"김태욱",read:{"김태욱":now-3*H,"이서연":now-2*H},done:{"이서연":now-H},comments:[],createdAt:now-3*H,updatedAt:now-H*1.5,updatedBy:"김태욱"};
    const b = {id:uid(),cat:"교육공지",date:t,title:"신규 멘토 온보딩 교육 (금 10시, 3층 세미나실)",body:"금요일 오전 10시 3층 세미나실에서 진행합니다.",links:"",important:false,needAction:false,due:"",author:"이서연",read:{"이서연":now-2*H},done:{},comments:[],createdAt:now-2*H};
    const c = {id:uid(),cat:"자료정보",date:dd(-1),title:"국민내일배움카드 개편 요약 자료",body:"상담 시 참고하세요.",links:"https://www.hrd.go.kr",important:false,needAction:false,due:"",author:"박준호",read:{"김태욱":now-D+H,"이서연":now-D+2*H,"박준호":now-D},done:{},comments:[{by:"이서연",at:now-D+2*H,text:"상담 스크립트에 반영했습니다."}],createdAt:now-D};
    const e = {id:uid(),cat:"공지사항",date:dd(-3),title:"9월 실적 마감 자료 제출",body:"각자 9월 실적 자료를 제출해 주세요.",links:"",important:true,needAction:true,due:dd(-1),author:"김태욱",read:{"김태욱":now-3*D,"이서연":now-3*D+H,"박준호":now-2*D},done:{"김태욱":now-2*D},comments:[],createdAt:now-3*D};
    notices = [a,b,c,e];
    logs = [
      {id:uid(),at:now-H*1.5,by:"김태욱",type:"edit",noticeId:a.id,title:a.title,cat:a.cat,changes:[
        {f:"body",from:"10월 개강반 시간표가 확정되었습니다.\n상담 시 변경된 시간표로 안내 부탁드립니다.",to:a.body},
        {f:"due",from:dd(1),to:dd(2)}]},
      {id:uid(),at:now-H,by:"이서연",type:"done",noticeId:a.id,title:a.title,cat:a.cat},
      {id:uid(),at:now-2*H,by:"이서연",type:"read",noticeId:a.id,title:a.title,cat:a.cat},
      {id:uid(),at:now-2*H,by:"이서연",type:"create",noticeId:b.id,title:b.title,cat:b.cat},
      {id:uid(),at:now-3*H,by:"김태욱",type:"create",noticeId:a.id,title:a.title,cat:a.cat},
      {id:uid(),at:now-D+2*H,by:"이서연",type:"comment",noticeId:c.id,title:c.title,cat:c.cat,text:"상담 스크립트에 반영했습니다."},
      {id:uid(),at:now-D,by:"박준호",type:"create",noticeId:c.id,title:c.title,cat:c.cat},
      {id:uid(),at:now-D-H,by:"박준호",type:"delete",noticeId:"x",title:"(중복) 내일배움카드 자료",cat:"자료정보"},
      {id:uid(),at:now-2*D,by:"김태욱",type:"done",noticeId:e.id,title:e.title,cat:e.cat},
      {id:uid(),at:now-3*D,by:"김태욱",type:"create",noticeId:e.id,title:e.title,cat:e.cat}
    ];
    saveDemo();
  }
  function initDemo(){
    notices = LS.get("nb2_notices", null);
    members = LS.get("nb2_members", []);
    logs = LS.get("nb2_logs", []);
    if(!notices) seed();
    setTimeout(emit,0);
  }
  function saveDemo(){ LS.set("nb2_notices",notices); LS.set("nb2_members",members); LS.set("nb2_logs",logs); }

  function logOf(type, n, by, extra){
    return {at:Date.now(), by:by||"", account:(api.user&&api.user.email)||"", type, noticeId:n.id||"", title:clip(n.title,200), cat:n.cat||"", ...(extra||{})};
  }
  async function writeLog(entry){
    if(api.live) await col("log").add(entry);
    else { logs.unshift({id:uid(), ...entry}); }
  }

  const api = {
    live: !!(FIREBASE_CONFIG.apiKey && window.firebase),
    diag: {errors:{}, loaded:false},
    user: null, authReady: false,
    async login(email, pw){ await firebase.auth().signInWithEmailAndPassword(email, pw); },
    async logout(){ await firebase.auth().signOut(); },
    async resetPw(email){ await firebase.auth().sendPasswordResetEmail(email); },
    async init(){
      if(FIREBASE_CONFIG.apiKey && !window.firebase){ api.diag.errors["SDK"] = "firebase-sdk-not-loaded"; }
      if(this.live){ try{ await initLive(); }catch(e){ api.diag.errors["초기화"] = e.message; this.live=false; initDemo(); } }
      else initDemo();
    },
    on(f){ listeners.push(f); },
    get notices(){ return notices; },
    get members(){ return members; },
    get logs(){ return logs; },

    async createNotice(data, by){
      const n = {...data, author:by||"", read: by?{[by]:Date.now()}:{}, done:{}, comments:[], createdAt:Date.now()};
      if(api.live){ const ref = await col("notices").add(n); n.id = ref.id; }
      else { n.id = uid(); notices.push(n); }
      await writeLog(logOf("create", n, by));
      if(!api.live){ saveDemo(); emit(); }
    },
    async updateNotice(id, data, by){
      const prev = notices.find(x=>x.id===id);
      const changes = Object.keys(FIELDS)
        .filter(k => String(prev[k] ?? "") !== String(data[k] ?? ""))
        .map(k => ({f:k, from:clip(prev[k]), to:clip(data[k])}));
      if(!changes.length) return 0;
      const upd = {...data, updatedAt:Date.now(), updatedBy:by||""};
      if(api.live) await col("notices").doc(id).update(upd);
      else Object.assign(prev, upd);
      await writeLog(logOf("edit", {...prev, ...data, id}, by, {changes}));
      if(!api.live){ saveDemo(); emit(); }
      return changes.length;
    },
    async deleteNotice(id, by){
      const n = notices.find(x=>x.id===id);
      if(api.live) await col("notices").doc(id).delete();
      else notices = notices.filter(x=>x.id!==id);
      await writeLog(logOf("delete", n, by, {snapshot:{body:clip(n.body,2000), date:n.date}}));
      if(!api.live){ saveDemo(); emit(); }
    },
    // 체크는 본인 칸만 갱신 → 동시 체크가 서로 덮어쓰지 않음
    async setMark(id, kind, name, on){
      const n = notices.find(x=>x.id===id);
      if(api.live){
        const V = firebase.firestore.FieldValue;
        await col("notices").doc(id).update(new firebase.firestore.FieldPath(kind,name), on ? Date.now() : V.delete());
      } else {
        n[kind] = n[kind] || {};
        if(on) n[kind][name] = Date.now(); else delete n[kind][name];
      }
      await writeLog(logOf(on ? kind : "undo", n, name, on ? null : {what:kind}));
      if(!api.live){ saveDemo(); emit(); }
    },
    async addComment(id, text, by){
      const n = notices.find(x=>x.id===id);
      const c = {by, at:Date.now(), text, k:uid()};
      if(api.live) await col("notices").doc(id).update({comments: firebase.firestore.FieldValue.arrayUnion(c)});
      else (n.comments = n.comments || []).push(c);
      await writeLog(logOf("comment", n, by, {text:clip(text,500)}));
      if(!api.live){ saveDemo(); emit(); }
    },
    async setMembers(list, by, note){
      if(api.live) await col("meta").doc("members").set({list});
      else members = list;
      if(note) await writeLog({at:Date.now(), by:by||"", account:(api.user&&api.user.email)||"", type:"member", noticeId:"", title:note, cat:""});
      if(!api.live){ saveDemo(); emit(); }
    }
  };
  return api;
})();

/* =========================================================
   3) 상태·판정
   ========================================================= */
const S = { view:"list", cat:"전체", q:"", state:"all", month:"", logType:"content", openId:null, me: LS.get("nb_me","") };
const M = () => Store.members;
const isRead = (n,m) => !!(n.read && n.read[m]);
const isDone = (n,m) => !!(n.done && n.done[m]);
const myUnread = n => S.me && !isRead(n,S.me);
const myTodo = n => S.me && n.needAction && !isDone(n,S.me);
function dueState(n){
  if(!n.needAction || !n.due) return "";
  if(M().length && M().every(m=>isDone(n,m))) return "";
  const diff = (new Date(n.due+"T00:00:00") - new Date(today()+"T00:00:00"))/86400000;
  return diff < 0 ? "over" : diff <= 2 ? "soon" : "";
}
function weekStart(){ const d=new Date(); d.setDate(d.getDate()-((d.getDay()+6)%7)); return ymd(d.getTime()); }
function dayTitle(d){
  const x = new Date(d+"T00:00:00");
  return `${x.getMonth()+1}월 ${x.getDate()}일 ${WD[x.getDay()]}요일`;
}
function dayRel(d){
  const diff = Math.round((new Date(today()+"T00:00:00") - new Date(d+"T00:00:00"))/86400000);
  return diff===0 ? "오늘" : diff===1 ? "어제" : "";
}
function nameList(arr){ return arr.length > 4 ? arr.slice(0,4).join(", ") + ` 외 ${arr.length-4}명` : arr.join(", "); }

function filteredNotices(ignoreCat){
  const q = S.q.trim().toLowerCase();
  return Store.notices.filter(n => {
    if(!ignoreCat && S.cat!=="전체" && n.cat!==S.cat) return false;
    if(S.month && !(n.date||"").startsWith(S.month)) return false;
    if(q && !((n.title||"")+" "+(n.body||"")).toLowerCase().includes(q)) return false;
    switch(S.state){
      case "unread": return myUnread(n);
      case "todo": return myTodo(n);
      case "open": return n.needAction && M().some(m=>!isDone(n,m));
      case "miss": return M().some(m=>!isRead(n,m));
      case "over": return dueState(n)==="over";
      case "imp": return !!n.important;
      case "week": return (n.date||"") >= weekStart();
    }
    return true;
  }).sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0));
}
const LOG_TYPES = {
  content:{label:"등록·수정·삭제", types:["create","edit","delete"]},
  check:{label:"확인·처리", types:["read","done","undo"]},
  comment:{label:"댓글", types:["comment"]},
  all:{label:"전체 활동", types:null}
};
function filteredLogs(){
  const q = S.q.trim().toLowerCase(), T = LOG_TYPES[S.logType].types;
  return Store.logs.filter(l => {
    if(T && !T.includes(l.type)) return false;
    if(S.cat!=="전체" && l.cat!==S.cat) return false;
    if(S.month && !ymd(l.at).startsWith(S.month)) return false;
    if(q && !((l.title||"")+" "+(l.by||"")+" "+(l.text||"")).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>b.at-a.at);
}

/* =========================================================
   4) 렌더링
   ========================================================= */
function showBanner(msg){ $("#banner").innerHTML = msg ? `<div class="banner">${esc(msg)}</div>` : ""; }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1700); }
function av(name, cls=""){ return `<span class="av ${cls}${name===S.me?" me":""}" title="${esc(name)}">${esc(initials(name))}</span>`; }

function render(){
  renderSide();
  const titles = {list:"공지 목록", matrix:"누락 현황", log:"변경 이력"};
  $("#pageTitle").textContent = titles[S.view];
  const d = new Date();
  $("#todayLbl").textContent = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`;
  renderBand(); renderToolbar();
  if(S.view==="list") renderList();
  else if(S.view==="matrix") renderMatrix();
  else renderLog();
  if(S.openId) renderDrawer(S.openId, true);
}

function renderDiag(bad){
  const box = $("#diag");
  if(!bad){ box.innerHTML = ""; return; }
  const D = Store.diag, codes = Object.values(D.errors).join(" ");
  const tips = [];
  if(D.errors["SDK"]) tips.push("Firebase 스크립트를 불러오지 못했습니다. 인터넷 연결이나 회사 방화벽(gstatic.com 차단)을 확인하세요.");
  if(/permission-denied/.test(codes)){
    tips.push("<b>Firestore 규칙이 막고 있습니다.</b> Firestore Database › 규칙 탭에 안내드린 규칙(noticeboard_notices / meta / log 세 줄)을 붙여넣고 <b>게시</b>를 눌렀는지 확인하세요.");
  }

/* --- 변경 이력 --- */
function lineDiff(a, b){
  const A = String(a||"").split("\n"), B = String(b||"").split("\n");
  if(A.length*B.length > 250000) return [{t:"d",s:"(내용이 길어 전체 비교를 생략했습니다)"}];
  const m=A.length, n=B.length, L = Array.from({length:m+1},()=>new Int32Array(n+1));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) L[i][j] = A[i]===B[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  const out=[]; let i=0,j=0;
  while(i<m && j<n){
    if(A[i]===B[j]){ out.push({t:"s",s:A[i]}); i++; j++; }
    else if(L[i+1][j] >= L[i][j+1]) out.push({t:"d",s:A[i++]});
    else out.push({t:"a",s:B[j++]});
  }
  while(i<m) out.push({t:"d",s:A[i++]});
  while(j<n) out.push({t:"a",s:B[j++]});
  // 바뀐 줄 주변만 남기고 같은 줄은 접기
  const keep = out.map((o,k)=> o.t!=="s" || out.slice(Math.max(0,k-1),k+2).some(x=>x.t!=="s"));
  const res=[]; let skipped=0;
  out.forEach((o,k)=>{ if(keep[k]){ if(skipped){ res.push({t:"x",s:`… 같은 내용 ${skipped}줄 …`}); skipped=0; } res.push(o); } else skipped++; });
  if(skipped) res.push({t:"x",s:`… 같은 내용 ${skipped}줄 …`});
  return res;
}
function fmtVal(f, v){
  if(f==="important"||f==="needAction") return (v===true||v==="true") ? "예" : "아니오";
  if(v===""||v==null) return "(없음)";
  return String(v);
}
function changesHTML(changes){
  return `<div class="chg">${(changes||[]).map(c => {
    if(c.f==="body" || c.f==="links"){
      const d = lineDiff(c.from, c.to);
      return `<div><span class="f">${FIELDS[c.f]}</span></div><div class="diff">${d.map(o=>`<div class="${o.t==="x"?"s":o.t==="s"?"":o.t}">${esc(o.s)||"&nbsp;"}</div>`).join("")}</div>`;
    }
    return `<div><span class="f">${FIELDS[c.f]||c.f}</span><del>${esc(fmtVal(c.f,c.from))}</del> → <ins>${esc(fmtVal(c.f,c.to))}</ins></div>`;
  }).join("")}</div>`;
}
const ACT = {create:"등록",edit:"수정",delete:"삭제",read:"확인",done:"처리완료",undo:"체크 취소",comment:"댓글",member:"팀원"};
function logDetail(l){
  if(l.type==="edit") return changesHTML(l.changes);
  if(l.type==="comment") return `<div class="quote">${esc(l.text)}</div>`;
  if(l.type==="undo") return `<div class="meta" style="margin-top:4px">${l.what==="done"?"처리완료":"확인"} 체크를 취소했습니다</div>`;
  if(l.type==="delete" && l.snapshot && l.snapshot.body) return `<div class="quote">${esc(l.snapshot.body.slice(0,300))}${l.snapshot.body.length>300?"…":""}</div>`;
  return "";
}

  const draft = refresh && $("#cmIn") ? $("#cmIn").value : "";
  const scroll = refresh && $(".dr-b") ? $(".dr-b").scrollTop : 0;
  const links = (n.links||"").split(/\n+/).map(s=>s.trim()).filter(Boolean)
    .map(u => /^https?:\/\//.test(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>` : `<span>${esc(u)}</span>`).join("");
  const box = (cls, title, names, map) => `<div class="box ${cls}"><h4><span>${title}</span><span>${names.length}명</span></h4>
    ${names.length ? `<ul>${names.map(m=>`<li>${av(m, cls==="ok"?"d":cls==="r"?"r":"")}${esc(m)}${map&&map[m]?`<small>${esc(stamp(map[m]))}</small>`:""}</li>`).join("")}</ul>` : `<div class="none">없음</div>`}</div>`;
  const read = mem.filter(m=>isRead(n,m)), unread = mem.filter(m=>!isRead(n,m));
  const done = mem.filter(m=>isDone(n,m)), notDone = mem.filter(m=>!isDone(n,m));
  const hist = Store.logs.filter(l=>l.noticeId===id).sort((a,b)=>b.at-a.at);

  $("#drawer").innerHTML = `
    <div class="dr-h">
      <div class="top"><span class="cat" data-c="${esc(n.cat)}"><span class="dot"></span>${esc(n.cat)}</span>
        ${n.important?`<span class="flag imp">중요</span>`:""}${n.needAction?`<span class="flag act">처리 필요</span>`:""}
        <button class="x" data-close>×</button></div>
      <h2>${esc(n.title)}</h2>
      <div class="meta">
        <span>게시 ${esc(n.date)}</span><span>작성 ${esc(n.author||"-")}</span>
        ${n.updatedAt?`<span class="edited">최종 수정 ${mdhm(n.updatedAt)} · ${esc(n.updatedBy||"")}</span>`:""}
        ${n.needAction&&n.due?`<span class="due ${ds}">기한 ${esc(n.due)}${ds==="over"?" (지남)":""}</span>`:""}
      </div>
      <div class="mybar">${S.me ? `
        <button class="btn ${isRead(n,S.me)?"on-r":"primary"}" data-mark="read" data-id="${n.id}" title="${isRead(n,S.me)?"다시 누르면 취소됩니다":""}">${isRead(n,S.me)?"✓ 확인함":"확인했습니다"}</button>
        ${n.needAction?`<button class="btn ${isDone(n,S.me)?"on-d":"ok"}" data-mark="done" data-id="${n.id}" title="${isDone(n,S.me)?"다시 누르면 취소됩니다":""}">${isDone(n,S.me)?"✓ 처리완료함":"처리완료"}</button>`:""}`
        : `<span class="meta">현재 사용자를 선택하면 체크할 수 있습니다</span>`}</div>
    </div>
    <div class="dr-b">
      <div class="body">${esc(n.body||"(내용 없음)")}</div>
      ${links?`<div class="links">${links}</div>`:""}

      <div class="sec"><div class="sec-t">확인 현황</div>
        <div class="split">${box("no","미확인",unread)}${box("r","확인함",read,n.read)}</div></div>
      ${n.needAction?`<div class="sec"><div class="sec-t">처리 현황</div>
        <div class="split">${box("p","미처리",notDone)}${box("ok","처리완료",done,n.done)}</div></div>`:""}

      <div class="sec"><div class="sec-t">댓글 ${(n.comments||[]).length}</div>
        ${(n.comments||[]).map(c=>`<div class="cm"><div class="h">${av(c.by,"r")}<b>${esc(c.by)}</b><small>${esc(stamp(c.at))}</small></div><p>${esc(c.text)}</p></div>`).join("")}
        <div class="cm-in"><input class="field" id="cmIn" placeholder="${S.me?"처리 내용·질문을 남기세요":"현재 사용자를 먼저 선택하세요"}" ${S.me?"":"disabled"}>
        <button class="btn" data-cmt="${n.id}" ${S.me?"":"disabled"}>등록</button></div></div>

      <div class="sec"><div class="sec-t">이 공지의 변경 이력 ${hist.length}</div>
        ${hist.length ? `<div class="tl">${hist.map(l=>`<div class="ev ${l.type}">
          <div class="h"><b>${esc(l.by||"이름 없음")}</b> · ${ACT[l.type]||l.type}<small>${mdhm(l.at)}</small></div>
          ${l.type==="edit"||l.type==="comment"||l.type==="undo" ? logDetail(l) : ""}</div>`).join("")}</div>`
          : `<div class="meta">기록이 없습니다</div>`}
      </div>
    </div>
    <div class="dr-f">
      <button class="btn sm" data-edit="${n.id}">수정</button>
      <button class="btn sm quiet danger" data-del="${n.id}">삭제</button>
    </div>`;
  if(draft) $("#cmIn").value = draft;
  if(scroll) $(".dr-b").scrollTop = scroll;
  if(!refresh) openDrawer();
}

/* --- 등록/수정 --- */
function openModal(html){ $("#modal").innerHTML = html; $("#mw").classList.add("on"); }
function closeModal(){ $("#mw").classList.remove("on"); }
function renderForm(id){
  const n = id ? Store.notices.find(x=>x.id===id)
    : {cat:S.cat!=="전체"?S.cat:"공지사항", date:today(), title:"", body:"", links:"", important:false, needAction:false, due:""};
  openModal(`
    <div class="mh"><h2>${id?"공지 수정":"새 공지 등록"}</h2><button class="x" data-mclose>×</button></div>
    <div class="mb"><form class="form" id="nf" onsubmit="return false">
      <label>분류<select class="field" name="cat">${CATS.map(c=>`<option ${c===n.cat?"selected":""}>${c}</option>`).join("")}</select></label>
      <label>게시일<input class="field" type="date" name="date" value="${esc(n.date)}" required></label>
      <label class="full">제목<input class="field" name="title" value="${esc(n.title)}" required placeholder="공지 제목"></label>
      <label class="full">내용<textarea class="field" name="body" placeholder="원문 공지를 그대로 붙여넣어도 됩니다">${esc(n.body)}</textarea></label>
      <label class="full">링크 · 첨부 위치 (한 줄에 하나)<textarea class="field" name="links" style="min-height:64px" placeholder="https://…   또는   공유드라이브 › 9월 › 시간표.xlsx">${esc(n.links)}</textarea></label>
      <label class="tog"><input type="checkbox" name="important" ${n.important?"checked":""}> 중요 공지</label>
      <label class="tog"><input type="checkbox" name="needAction" id="naChk" ${n.needAction?"checked":""}> 처리(조치)가 필요한 공지</label>
      <label class="full" id="dueWrap" style="${n.needAction?"":"display:none"}">처리 기한<input class="field" type="date" name="due" value="${esc(n.due)}"></label>
    </form>
    ${id?`<p class="note">수정하면 바뀐 항목이 '변경 이력'에 수정 전·후로 기록됩니다.</p>`:""}</div>
    <div class="mf"><button class="btn quiet" data-mclose>취소</button><button class="btn primary" id="saveBtn" data-id="${id||""}">${id?"수정 저장":"등록"}</button></div>`);
  $("#naChk").onchange = e => $("#dueWrap").style.display = e.target.checked ? "" : "none";
  setTimeout(()=>$("#nf [name=title]").focus(),30);
}
async function submitForm(id){
  const f = $("#nf");
  if(!f.reportValidity()) return;
  const fd = new FormData(f);
  const data = {
    cat: fd.get("cat"), date: fd.get("date"), title: fd.get("title").trim(), body: fd.get("body"),
    links: fd.get("links"), important: !!fd.get("important"), needAction: !!fd.get("needAction"),
    due: fd.get("needAction") ? fd.get("due") : ""
  };
  const btn = $("#saveBtn"); btn.disabled = true;
  try{
    if(id){ const k = await Store.updateNotice(id, data, S.me); toast(k ? `${k}개 항목을 수정했습니다` : "바뀐 내용이 없습니다"); }
    else { await Store.createNotice(data, S.me); toast("등록했습니다"); }
    closeModal();
  }catch(e){ btn.disabled = false; fail(e); }
}
function fail(e){
  console.error(e);
  const c = e.code || e.message;
  toast(/permission-denied/.test(c) ? "저장 실패: 권한 없음 (위쪽 안내를 확인하세요)" : "저장 실패: " + c);
  if(/permission-denied/.test(c)){ Store.diag.errors["저장"] = c; render(); }
}

/* --- 팀원 --- */
function renderMembers(){
  openModal(`
    <div class="mh"><h2>팀원 관리</h2><button class="x" data-mclose>×</button></div>
    <div class="mb">
      <div class="mem">${M().map((m,i)=>`<div>${av(m,"r")}<span>${esc(m)}</span>
        <button class="btn sm quiet" data-mup="${i}" ${i?"":"disabled"}>위로</button>
        <button class="btn sm quiet danger" data-mdel="${i}">삭제</button></div>`).join("") || `<p class="meta">아직 팀원이 없습니다.</p>`}</div>
      <div class="cm-in" style="margin-top:16px"><input class="field" id="memIn" placeholder="이름 입력 후 Enter"><button class="btn primary" id="memAdd">추가</button></div>
      <p class="note">삭제해도 공지의 체크 기록은 남아 있어, 같은 이름으로 다시 추가하면 그대로 보입니다.</p>
    </div>`);
  setTimeout(()=>$("#memIn") && $("#memIn").focus(),30);
}
async function addMember(){
  const v = $("#memIn").value.trim();
  if(!v) return;
  if(M().includes(v)) return toast("이미 있는 이름입니다");
  try{
    await Store.setMembers([...M(), v], S.me || v, `팀원 추가: ${v}`);
    if(!S.me){ S.me = v; LS.set("nb_me", v); }
    renderMembers(); render(); toast(v + " 님을 추가했습니다");
  }catch(e){ fail(e); }
}

/* =========================================================
   5) 이벤트
   ========================================================= */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-close],[data-mclose],[data-open],[data-view],[data-cat],[data-state],[data-logtype],[data-mark],[data-cmt],[data-edit],[data-del],[data-mup],[data-mdel],button");
  if(e.target.id==="scrim") return closeDrawer();
  if(e.target.id==="mw") return closeModal();
  if(!el) return;
  const D = el.dataset;
  if("close" in D) return closeDrawer();
  if("mclose" in D) return closeModal();
  if(D.open) return renderDrawer(D.open);
  if(D.view){ S.view = D.view; S.q=""; window.scrollTo(0,0); return render(); }
  if(D.cat){ S.cat = D.cat; return render(); }
  if(D.state){ S.state = D.state; if(S.view==="log") S.view="list"; return render(); }
  if(D.logtype){ S.logType = D.logtype; S.view="log"; return render(); }
  if(D.mark){
    const n = Store.notices.find(x=>x.id===D.id), k = D.mark, on = !(n[k] && n[k][S.me]);
    try{
      await Store.setMark(n.id, k, S.me, on);
      if(k==="done" && on && !isRead(n,S.me)) await Store.setMark(n.id, "read", S.me, true);
      toast(on ? (k==="read" ? "확인으로 체크했습니다" : "처리완료로 체크했습니다") : "체크를 취소했습니다");
    }catch(err){ fail(err); }
    return;
  }
  if(D.cmt){
    const v = $("#cmIn").value.trim(); if(!v) return;
    $("#cmIn").value = "";
    try{ await Store.addComment(D.cmt, v, S.me); }catch(err){ fail(err); }
    return;
  }
  if(D.edit) return renderForm(D.edit);
  if(D.del){
    const n = Store.notices.find(x=>x.id===D.del);
    if(!confirm(`'${n.title}' 공지를 삭제할까요?\n삭제 기록은 변경 이력에 남지만 체크 기록은 사라집니다.`)) return;
    try{ await Store.deleteNotice(D.del, S.me); closeDrawer(); toast("삭제했습니다"); }catch(err){ fail(err); }
    return;
  }
  if(D.mdel){
    const name = M()[+D.mdel];
    if(!confirm(name + " 님을 팀원 목록에서 뺄까요?")) return;
    await Store.setMembers(M().filter(m=>m!==name), S.me, `팀원 삭제: ${name}`); renderMembers(); return;
  }
  if(D.mup){
    const i = +D.mup, L = [...M()]; [L[i-1],L[i]] = [L[i],L[i-1]];
    await Store.setMembers(L); renderMembers(); return;
  }
  switch(el.id){
    case "saveBtn": return submitForm(D.id);
    case "loginBtn": return doLogin();
    case "resetBtn": return doReset();
    case "logoutBtn": if(confirm("로그아웃할까요?")) { closeDrawer(); await Store.logout(); } return;
    case "newBtn": return renderForm();
    case "memBtn": return renderMembers();
    case "memAdd": return addMember();
    case "themeBtn": return setTheme(document.documentElement.dataset.theme==="dark" ? "light" : "dark");
  }
});
document.addEventListener("keydown", e => {
  if(e.key==="Escape"){ if($("#mw").classList.contains("on")) closeModal(); else closeDrawer(); }
  if(e.key==="Enter" && !e.isComposing){
    if(e.target.id==="memIn") addMember();
    if(e.target.id==="cmIn") document.querySelector("[data-cmt]")?.click();
  }
});
document.addEventListener("input", e => {
  if(e.target.id==="q"){ S.q = e.target.value; render(); }
});
document.addEventListener("change", e => {
  if(e.target.id==="fMonth"){ S.month = e.target.value; render(); }
  if(e.target.id==="meSel"){ S.me = e.target.value; LS.set("nb_me", S.me); render(); }
});

function setTheme(t){
  document.documentElement.dataset.theme = t;
  $("#themeBtn").textContent = t==="dark" ? "라이트" : "다크";
  LS.set("nb_theme", t);
}
setTheme(LS.get("nb_theme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

Store.on(render);
render();
Store.init().then(render);
</script>
</body>
</html>
